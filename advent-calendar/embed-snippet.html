<!-- Christmas Classics Calendar embed.
     Option A (recommended): two lines. The frame resizes itself to fit, so the CMS can't cut it off.
     Change both addresses to where the calendar is hosted.
     Use calendar-simple.html (dark, on brand) or calendar-festive.html (red, snow). -->
<div data-christmas-classics data-src="https://YOUR-HOST/christmas-classics/calendar-simple.html"></div>
<script src="https://YOUR-HOST/christmas-classics/embed.js" defer></script>
